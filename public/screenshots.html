<!DOCTYPE html>
<html>
<head>
<style>
body { background: #f8f6ef; margin: 0; padding: 20px; font-family: system-ui; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.card { background: white; border-radius: 20px; padding: 16px; box-shadow: 0 8px 24px rgba(78,64,55,0.1); border: 1px solid #e7dacf; text-align: center; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: #342421; }
.card .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; margin-bottom: 8px; }
.tag-easy { background: #E8F5E9; color: #2E7D32; }
.tag-medium { background: #FFF3E0; color: #E65100; }
.tag-hard { background: #FFCDD2; color: #C62828; }
.tag-daily { background: #F3E5F5; color: #6A1B9A; }
canvas { border-radius: 12px; }
</style>
</head>
<body>
<div class="card" id="card-easy">
  <span class="tag tag-easy">BEGINNER</span>
  <h3>Easy Puzzles</h3>
  <canvas id="cv-easy"></canvas>
</div>
<div class="card" id="card-medium">
  <span class="tag tag-medium">MEDIUM</span>
  <h3>Medium Puzzles</h3>
  <canvas id="cv-medium"></canvas>
</div>
<div class="card" id="card-hard">
  <span class="tag tag-hard">HARD</span>
  <h3>Hard Puzzles</h3>
  <canvas id="cv-hard"></canvas>
</div>
<div class="card" id="card-daily">
  <span class="tag tag-daily">DAILY</span>
  <h3>Daily Challenge</h3>
  <canvas id="cv-daily"></canvas>
</div>

<script src="/akari-engine.js"></script>
<script>
function renderPuzzle(canvasId, size) {
  const puzzle = generatePuzzle(size);
  const canvas = document.getElementById(canvasId);
  const cellSize = Math.max(20, Math.min(36, Math.floor(280 / size)));
  const gap = 2;
  const padding = 8;
  const totalSize = size * cellSize + (size - 1) * gap + padding * 2;
  canvas.width = totalSize;
  canvas.height = totalSize;
  const ctx = canvas.getContext('2d');
  
  // Background
  ctx.fillStyle = '#E8DDD8';
  ctx.beginPath();
  ctx.roundRect(0, 0, totalSize, totalSize, 12);
  ctx.fill();
  
  // Draw cells
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const x = padding + c * (cellSize + gap);
      const y = padding + r * (cellSize + gap);
      const val = puzzle.grid[r][c];
      
      if (val !== 9) {
        // Black wall
        ctx.fillStyle = '#8B7B9A';
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 6);
        ctx.fill();
        if (val >= 0) {
          ctx.fillStyle = '#F0E8FF';
          ctx.font = `bold ${Math.max(10, cellSize * 0.45)}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(val, x + cellSize / 2, y + cellSize / 2);
        }
      } else {
        // Empty cell - some lit, some dark
        ctx.fillStyle = '#F0EBE5';
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 6);
        ctx.fill();
      }
    }
  }
  
  // Place some cats from solution for visual appeal
  const solution = puzzle.solution;
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (solution[r][c]) {
        const x = padding + c * (cellSize + gap);
        const y = padding + r * (cellSize + gap);
        // Cat cell
        ctx.fillStyle = '#F0E8FF';
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 6);
        ctx.fill();
        // Cat emoji
        ctx.font = `${cellSize * 0.6}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🐱', x + cellSize / 2, y + cellSize / 2);
      }
    }
  }
  
  // Light up cells that are illuminated
  const lit = illuminate(puzzle.grid, solution, size);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (puzzle.grid[r][c] === 9 && !solution[r][c] && lit[r][c]) {
        const x = padding + c * (cellSize + gap);
        const y = padding + r * (cellSize + gap);
        ctx.fillStyle = '#FFF8F0';
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 6);
        ctx.fill();
      }
    }
  }
}

renderPuzzle('cv-easy', 5);
renderPuzzle('cv-medium', 7);
renderPuzzle('cv-hard', 9);
renderPuzzle('cv-daily', 12);
</script>
</body>
</html>
