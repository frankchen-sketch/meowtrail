    const CAT_IMG = '<img src="/assets/cats/cat-clay-purple.png" style="width:95%;height:95%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 2px 6px rgba(123,107,138,.4))" />';
    const X_MARK = '<svg viewBox="0 0 24 24" width="50%" height="50%" style="opacity:0.4"><line x1="6" y1="6" x2="18" y2="18" stroke="#B8A8C8" stroke-width="2.5" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="#B8A8C8" stroke-width="2.5" stroke-linecap="round"/></svg>';
    const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
    let currentPuzzle = null, playerSolution = null, markX = null, won = false;
    let health = 3, timerInterval = null, startTime = null, elapsedTime = 0;
    let lastPlacedCell = null;
    const gridEl = document.getElementById('puzzle-grid');
    const progressEl = document.getElementById('progress');
    const toastEl = document.getElementById('toast');
    const timerEl = document.getElementById('timer');
    const winOverlay = document.getElementById('win-overlay');
    const healthDisplay = document.getElementById('health-display');
    let toastTimer = null;

    // Generate daily seed based on date
    function getDailySeed() {
      const today = new Date();
      return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
    }

    // Simple seeded random
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function showToast(m, t) {
      toastEl.textContent = m; toastEl.className = 'toast show' + (t === 'success' ? ' success' : '');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2500);
    }

    function updateTimer() {
      if (!startTime) return;
      elapsedTime = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsedTime / 60);
      const seconds = elapsedTime % 60;
      timerEl.textContent = minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
    }

    function startTimer() {
      startTime = Date.now();
      elapsedTime = 0;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function spawnConfetti() {
      const c = document.getElementById('confetti-container');
      if (!c) return; c.innerHTML = '';
      const colors = ['#C8A8E8','#E8A888','#88C8A8','#F0E8FF','#FFB347','#A888C8'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div'); el.className = 'confetti';
        el.style.left = Math.random()*100+'%'; el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration = (2+Math.random()*3)+'s'; el.style.animationDelay = Math.random()*1.5+'s';
        el.style.width = (8+Math.random()*8)+'px'; el.style.height = (8+Math.random()*8)+'px'; c.appendChild(el);
      }
      for (let i = 0; i < 12; i++) {
        const el = document.createElement('div'); el.className = 'paw-confetti'; el.textContent = '🐾';
        el.style.left = Math.random()*100+'%'; el.style.animationDuration = (3+Math.random()*3)+'s';
        el.style.animationDelay = Math.random()*2+'s'; c.appendChild(el);
      }
    }

    function startDailyChallenge() {
      won = false; winOverlay.classList.remove('show');
      health = 3;
      updateHealth();
      const seed = getDailySeed();
      const rng = seededRandom(seed);
      gridEl.innerHTML = '<div style="padding:2rem;color:#8B7B8B;font-size:0.9rem;">Generating...</div>';
      progressEl.textContent = '';
      setTimeout(() => {
        try {
          // Generate super hard puzzle (14x14)
          currentPuzzle = generatePuzzle(14);
          playerSolution = Array.from({length:14}, () => Array(14).fill(false));
          markX = Array.from({length:14}, () => Array(14).fill(false));
          renderBoard(); updateProgress();
          startTimer();
          document.getElementById('start-btn').textContent = '🔄 Restart';
        } catch(e) { showToast('Failed to generate.', 'error'); }
      }, 10);
    }

    function resetPuzzle() {
      if (!currentPuzzle) return; won = false; winOverlay.classList.remove('show');
      const s = currentPuzzle.size;
      playerSolution = Array.from({length:s}, () => Array(s).fill(false));
      markX = Array.from({length:s}, () => Array(s).fill(false));
      health = 3;
      updateHealth();
      startTimer();
      renderBoard(); updateProgress(); showToast('Board reset!', 'success');
    }

    function renderBoard() {
      if (!currentPuzzle) return;
      const g = currentPuzzle.grid, s = currentPuzzle.size;
      const lit = illuminate(g, playerSolution, s);
      const v = checkViolations(g, playerSolution, s);
      const vc = {}, cp = {};
      v.forEach(x => {
        if (x.type === 'number_excess') {
          vc[x.row+','+x.col] = true;
          DIRS.forEach(d => { const nr=x.row+d[0],nc=x.col+d[1]; if(nr>=0&&nr<s&&nc>=0&&nc<s&&playerSolution[nr][nc]) vc[nr+','+nc]=true; });
        } else if (x.type === 'cat_conflict') { cp[x.row+','+x.col]=true; cp[x.row2+','+x.col2]=true; }
      });
      const mw = Math.min(window.innerWidth-40,600);
      const cs = Math.max(24,Math.min(36,Math.floor((mw-(s+1)*2-8)/s)));
      gridEl.style.gridTemplateColumns = `repeat(${s},${cs}px)`;
      gridEl.style.gridTemplateRows = `repeat(${s},${cs}px)`;
      gridEl.innerHTML = '';
      for (let r=0;r<s;r++) for (let c=0;c<s;c++) {
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.style.width = cs+'px'; cell.style.height = cs+'px';
        cell.dataset.row = r; cell.dataset.col = c;
        const val = g[r][c], key = r+','+c;
        if (val !== 9) {
          cell.classList.add('cell-black');
          if (val >= 0) { cell.classList.add('cell-number'); cell.textContent = val; cell.style.fontSize = Math.max(10,cs*.4)+'px'; if(vc[key]) cell.classList.add('cell-violation'); }
        } else {
          if (playerSolution[r][c]) { 
            cell.classList.add('cell-cat');
            if (lastPlacedCell && lastPlacedCell.r === r && lastPlacedCell.c === c) {
              cell.classList.add('cell-cat-new');
            }
            cell.innerHTML = CAT_IMG; 
            if(cp[key]) cell.classList.add('cell-shake'); 
          }
          else if (markX[r][c]) { cell.classList.add('cell-x'); cell.innerHTML = X_MARK; }
          else if (lit[r][c]) { cell.classList.add('cell-lit'); }
          else { cell.classList.add('cell-dark'); }
          cell.addEventListener('click', e => { e.preventDefault(); if(!won) handleClick(r,c); });
          cell.addEventListener('dblclick', e => { e.preventDefault(); if(!won){markX[r][c]=!markX[r][c];renderBoard();} });
          cell.addEventListener('contextmenu', e => { e.preventDefault(); if(!won){markX[r][c]=!markX[r][c];renderBoard();} });
          let lpt=null,dlp=false;
          cell.addEventListener('touchstart',()=>{dlp=false;lpt=setTimeout(()=>{dlp=true;if(!won){markX[r][c]=!markX[r][c];renderBoard();}},500);},{passive:true});
          cell.addEventListener('touchend',e=>{if(lpt)clearTimeout(lpt);if(dlp)e.preventDefault();});
          cell.addEventListener('touchmove',()=>{if(lpt)clearTimeout(lpt);},{passive:true});
        }
        gridEl.appendChild(cell);
      }
    }

    function handleClick(r, c) {
      if (!currentPuzzle) return;
      const g = currentPuzzle.grid, s = currentPuzzle.size;
      if (playerSolution[r][c]) {
        playerSolution[r][c] = false;
        lastPlacedCell = null;
      }
      else {
        markX[r][c] = false; playerSolution[r][c] = true;
        lastPlacedCell = {r, c};
        const v = checkViolations(g, playerSolution, s);
        let hasViolation = false;
        for (const x of v) { 
          if(x.type==='number_excess'){
            showToast('Too many cats around number '+x.number+'!','error');
            hasViolation=true;
            break;
          }
        }
        for (const x of v) { 
          if(x.type==='cat_conflict'){
            showToast('Two cats are facing each other!','error');
            hasViolation=true;
            break;
          }
        }
        if (hasViolation) {
          loseHealth();
        }
      }
      renderBoard(); updateProgress();
      setTimeout(() => { lastPlacedCell = null; }, 500);
      if (checkWin(g, playerSolution, s)) { 
        won=true; 
        stopTimer();
        spawnConfetti(); 
        setTimeout(()=>{
          winOverlay.classList.add('show');
          document.getElementById('final-time').textContent = timerEl.textContent;
          // Calculate percentile (simulated)
          const percentile = Math.max(10, Math.min(99, 100 - Math.floor(elapsedTime / 10)));
          document.getElementById('percentile').textContent = 'Top ' + percentile + '%';
        },300); 
      }
    }

    function updateProgress() {
      if (!currentPuzzle) return;
      const catsPlaced = playerSolution.flat().filter(Boolean).length;
      const totalCats = currentPuzzle.solution.flat().filter(Boolean).length;
      progressEl.textContent = catsPlaced + ' / ' + totalCats + ' cats placed';
    }

    function updateHealth() {
      const hearts = healthDisplay.querySelectorAll('.heart');
      hearts.forEach((heart, i) => {
        if (i < health) {
          heart.classList.remove('lost');
        } else {
          heart.classList.add('lost');
        }
      });
    }

    function loseHealth() {
      if (health > 0) {
        health--;
        updateHealth();
        if (health === 0) {
          showToast('Game Over! Try again.', 'error');
          stopTimer();
          setTimeout(resetPuzzle, 1500);
        }
      }
    }

    // Generate share card
    function generateShareCard() {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      
      const gradient = ctx.createLinearGradient(0, 0, 600, 400);
      gradient.addColorStop(0, '#FBF8FF');
      gradient.addColorStop(1, '#F8F5F0');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 600, 400);
      
      ctx.fillStyle = '#7B6B8A';
      ctx.font = 'bold 32px SF Pro Rounded, system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('🐱 MeowTrail Daily Challenge', 300, 50);
      
      ctx.font = 'bold 24px SF Pro Rounded, system-ui';
      ctx.fillText('🔥 SUPER HARD', 300, 90);
      
      ctx.font = 'bold 48px SF Pro Rounded, system-ui';
      ctx.fillText(timerEl.textContent, 300, 160);
      
      ctx.font = '18px SF Pro Rounded, system-ui';
      ctx.fillText('Your Time', 300, 190);
      
      const percentile = document.getElementById('percentile').textContent;
      ctx.font = 'bold 24px SF Pro Rounded, system-ui';
      ctx.fillText(percentile + ' of players', 300, 240);
      
      ctx.font = '16px SF Pro Rounded, system-ui';
      ctx.fillStyle = '#8B7B8B';
      ctx.fillText('Play free at meowtrail.org', 300, 300);
      
      ctx.font = '40px serif';
      ctx.fillText('🐾', 50, 350);
      ctx.fillText('🐾', 550, 350);
      
      return canvas.toDataURL('image/png');
    }

    // Load leaderboard
    function loadLeaderboard() {
      const leaderboard = document.getElementById('leaderboard-list');
      // Simulated leaderboard data
      const data = [
        { rank: 1, name: 'CatMaster', time: '02:34' },
        { rank: 2, name: 'PuzzlePro', time: '03:12' },
        { rank: 3, name: 'LightUp', time: '03:45' },
        { rank: 4, name: 'MeowFan', time: '04:01' },
        { rank: 5, name: 'You', time: '--:--' }
      ];
      
      leaderboard.innerHTML = data.map(item => `
        <div class="leaderboard-item">
          <span class="rank">#${item.rank}</span>
          <span class="player-name">${item.name}</span>
          <span class="time">${item.time}</span>
        </div>
      `).join('');
    }

    document.getElementById('start-btn').addEventListener('click', startDailyChallenge);
    document.getElementById('hint-btn').addEventListener('click', () => {
      if (!currentPuzzle || won) return;
      const h = getHint(currentPuzzle.grid, currentPuzzle.solution, playerSolution, currentPuzzle.size);
      if (h) {
        const cell = gridEl.querySelector('[data-row="'+h[0]+'"][data-col="'+h[1]+'"]');
        if (cell) { cell.classList.add('cell-hint'); setTimeout(()=>cell.classList.remove('cell-hint'),2000); }
        showToast('Hint: try row '+(h[0]+1)+', col '+(h[1]+1),'success');
      } else showToast('No hints!','error');
    });
    document.getElementById('reset-btn').addEventListener('click', resetPuzzle);
    document.getElementById('share-card-btn').addEventListener('click', () => {
      const cardData = generateShareCard();
      const link = document.createElement('a');
      link.download = 'meowtrail-daily-' + new Date().toISOString().split('T')[0] + '.png';
      link.href = cardData;
      link.click();
      showToast('📸 Share card downloaded!', 'success');
    });
    document.getElementById('share-copy').addEventListener('click', () => {
      const text = '🐱 MeowTrail Daily Challenge\n⏱️ ' + timerEl.textContent + '\n' + document.getElementById('percentile').textContent + ' of players\n\nPlay free at meowtrail.org';
      navigator.clipboard.writeText(text).then(() => showToast('📋 Copied to clipboard!', 'success'));
    });
    document.getElementById('share-twitter').addEventListener('click', () => {
      const text = encodeURIComponent('🐱 Just completed the MeowTrail Daily Challenge!\n⏱️ ' + timerEl.textContent + '\n' + document.getElementById('percentile').textContent + ' of players\n\nPlay free at meowtrail.org');
      window.open('https://twitter.com/intent/tweet?text=' + text, '_blank');
    });

    updateHealth();
    loadLeaderboard();
